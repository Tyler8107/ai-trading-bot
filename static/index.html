<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trading Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: "#00d4aa" } } } };
  </script>
  <style>
    body { background: #0a0f1e; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .fade-in { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    ::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-track{background:#0f172a} ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
    .trade-card { cursor:pointer; }
    .trade-reason { display:none; }
    .trade-card.expanded .trade-reason { display:block; }
    .trade-card.expanded .trade-chevron { transform:rotate(180deg); }
    .trade-chevron { transition:transform .2s; display:inline-block; }
    /* Modal */
    .modal-backdrop { position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px; }
    .modal-box { background:#0f172a;border:1px solid #334155;border-radius:16px;padding:28px;max-width:420px;width:100%;animation:modalIn .2s ease; }
    @keyframes modalIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
    /* Toast */
    .toast-container { position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none; }
    .toast { background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:10px 18px;border-radius:10px;font-size:14px;white-space:nowrap;animation:toastIn .25s ease;pointer-events:auto; }
    .toast.success { border-color:#0d9488;color:#2dd4bf; }
    .toast.error { border-color:#dc2626;color:#f87171; }
    @keyframes toastIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let state = {
  page: localStorage.getItem("token") ? "dashboard" : "login",
  token: localStorage.getItem("token") || "",
  email: localStorage.getItem("email") || "",
  portfolio: null,
  trades: [],
  botStatus: { running: false, status: "stopped", log: [], last_run: null, market_commentary: "" },
  settings: null,
  settingsForm: null,
  subscription: { active: false, status: "inactive" },
  error: "",
  loading: false,
  botLoading: false,
  settingsSaved: false,
  modal: null,   // { type: "confirm-start"|"subscribe"|"stop-confirm", ... }
  toasts: [],
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ── API ────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const res = await fetch("/api" + path, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(state.token ? { Authorization: "Bearer " + state.token } : {})
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ── Actions ────────────────────────────────────────────────────────────────
async function login(email, password) {
  setState({ loading: true, error: "" });
  try {
    const d = await api("POST", "/auth/login", { email, password });
    localStorage.setItem("token", d.token);
    localStorage.setItem("email", d.email);
    setState({ token: d.token, email: d.email, page: "dashboard", loading: false });
    loadDashboard();
  } catch(e) { setState({ error: e.message, loading: false }); }
}

async function register(email, password) {
  setState({ loading: true, error: "" });
  try {
    const d = await api("POST", "/auth/register", { email, password });
    localStorage.setItem("token", d.token);
    localStorage.setItem("email", d.email);
    setState({ token: d.token, email: d.email, page: "settings", loading: false });
    loadSettings();
  } catch(e) { setState({ error: e.message, loading: false }); }
}

function logout() {
  localStorage.clear();
  setState({ token: "", email: "", page: "login", portfolio: null, trades: [], error: "", settingsForm: null });
}

async function loadDashboard() {
  try {
    const [p, t, s, sub] = await Promise.all([
      api("GET", "/portfolio").catch(e => ({ error: e.message })),
      api("GET", "/trades").catch(() => []),
      api("GET", "/bot/status").catch(() => ({})),
      api("GET", "/subscription/status").catch(() => ({ active: false, status: "inactive" })),
    ]);
    setState({ portfolio: p.error ? null : p, trades: t, botStatus: s, subscription: sub, error: p.error || "" });
  } catch(e) { setState({ error: e.message }); }
}

async function subscribe() {
  setState({ loading: true });
  try {
    const d = await api("POST", "/subscription/checkout");
    window.location.href = d.url;
  } catch(e) {
    setState({ loading: false });
    showToast(e.message || "Could not start checkout — try again", "error");
  }
}

async function manageBilling() {
  setState({ loading: true });
  try {
    const d = await api("POST", "/subscription/portal");
    window.location.href = d.url;
  } catch(e) {
    setState({ loading: false });
    showToast(e.message || "Could not open billing portal", "error");
  }
}

async function loadSettings() {
  try {
    const s = await api("GET", "/settings");
    // Only initialize settingsForm if it hasn't been set yet (don't overwrite user edits)
    if (!state.settingsForm) {
      setState({ settings: s, settingsForm: buildForm(s) });
    } else {
      setState({ settings: s });
    }
  } catch(e) {}
}

function buildForm(s) {
  return {
    broker: s.broker || "alpaca",
    alpaca_api_key: s.alpaca_api_key || "",
    alpaca_secret_key: "",
    alpaca_paper: s.alpaca_paper !== false,
    rh_username: s.rh_username || "",
    rh_password: "",
    anthropic_api_key: "",
    max_position_usd: s.max_position_usd || 25,
    max_daily_loss_usd: s.max_daily_loss_usd || 50,
    run_interval_minutes: s.run_interval_minutes || 30,
    dry_run: s.dry_run !== false,
  };
}

async function saveSettings() {
  // Ensure form exists even if loadSettings failed
  if (!state.settingsForm) {
    setState({ error: "Form not loaded — please refresh the page and try again." });
    return;
  }
  setState({ loading: true, error: "" });
  try {
    await api("PUT", "/settings", state.settingsForm);
    // Reload subscription status so Start Bot reflects latest state
    const sub = await api("GET", "/subscription/status").catch(() => state.subscription);
    setState({ loading: false, settingsSaved: true, subscription: sub });
    setTimeout(() => setState({ settingsSaved: false }), 4000);
  } catch(e) {
    const msg = e.message === "Unauthorized" ? "Session expired — please log out and log back in." : e.message;
    setState({ error: msg, loading: false });
  }
}

function updateForm(key, value) {
  // Initialize form from defaults if it somehow wasn't set
  const base = state.settingsForm || buildForm(state.settings || {});
  setState({ settingsForm: { ...base, [key]: value } });
}

function showToast(msg, type = "success", duration = 3500) {
  const id = Date.now();
  setState({ toasts: [...state.toasts, { id, msg, type }] });
  setTimeout(() => setState({ toasts: state.toasts.filter(t => t.id !== id) }), duration);
}

function showModal(modal) { setState({ modal }); }
function closeModal() { setState({ modal: null }); }

function toggleBot() {
  if (state.botStatus.running) {
    showModal({ type: "stop-confirm" });
  } else if (!state.subscription.active) {
    showModal({ type: "subscribe" });
  } else {
    showModal({ type: "confirm-start" });
  }
}

async function doStartBot() {
  closeModal();
  setState({ botLoading: true });
  try {
    await api("POST", "/bot/start");
    await loadDashboard();
    showToast("Bot is running — Claude is analyzing your portfolio", "success");
  } catch(e) {
    if (e.message === "subscription_required") showModal({ type: "subscribe" });
    else if (e.message.includes("broker") || e.message.includes("Configure")) {
      showToast("Connect a brokerage account first", "error");
      setTimeout(() => goSettings(), 1200);
    } else showToast(e.message, "error");
  }
  setState({ botLoading: false });
}

async function doStopBot() {
  closeModal();
  setState({ botLoading: true });
  try {
    await api("POST", "/bot/stop");
    await loadDashboard();
    showToast("Bot stopped", "success");
  } catch(e) { showToast(e.message, "error"); }
  setState({ botLoading: false });
}

// ── Components ─────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "className") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "value" && (tag === "input" || tag === "select" || tag === "textarea")) { e.value = v; }
      else if (k === "checked") e.checked = v;
      else if (k === "disabled") e.disabled = v;
      else if (k === "type" && tag === "input") e.type = v;
      else e.setAttribute(k, v);
    }
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined) continue;
    e.append(typeof c === "string" || typeof c === "number" ? c : c);
  }
  return e;
}

function inp(attrs) {
  const e = document.createElement("input");
  const base = "w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-teal-500 text-sm transition";
  e.className = base;
  e.type = attrs.type || "text";
  if (attrs.placeholder) e.placeholder = attrs.placeholder;
  if (attrs.value !== undefined) e.value = attrs.value;
  if (attrs.required) e.required = true;
  if (attrs.min) e.min = attrs.min;
  if (attrs.onChange) e.addEventListener("input", attrs.onChange);
  return e;
}

function toggleGroup(options, currentVal, onSelect) {
  return el("div", { className: "flex gap-2 flex-wrap" }, ...options.map(([label, val]) =>
    el("button", {
      type: "button",
      className: "flex-1 py-2.5 px-3 rounded-lg text-sm font-medium border transition min-w-fit " +
        (currentVal === val
          ? "bg-teal-500 border-teal-500 text-black"
          : "bg-slate-800 border-slate-600 text-slate-300 hover:border-slate-400"),
      onClick: () => onSelect(val),
    }, label)
  ));
}

// ── Pages ──────────────────────────────────────────────────────────────────
function renderLogin(isRegister) {
  let emailVal = "", passVal = "";
  const err = el("div", { className: "bg-red-900/30 border border-red-700 text-red-400 rounded-lg px-4 py-3 mb-4 text-sm " + (state.error ? "" : "hidden") }, state.error);
  const emailInput = inp({ placeholder: "you@example.com", type: "email", onChange: e => emailVal = e.target.value });
  const passInput = inp({ placeholder: isRegister ? "min 8 characters" : "••••••••", type: "password", onChange: e => passVal = e.target.value });
  const btn = el("button", {
    type: "submit",
    className: "w-full bg-teal-500 hover:bg-teal-400 disabled:opacity-50 text-black font-bold py-3 rounded-lg transition",
  }, isRegister ? "Get Started" : "Sign In");

  const form = el("form", { className: "space-y-4" },
    el("div", null, el("label", { className: "block text-sm text-slate-400 mb-1" }, "Email"), emailInput),
    el("div", null, el("label", { className: "block text-sm text-slate-400 mb-1" }, "Password"), passInput),
    btn,
  );
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (isRegister) register(emailVal, passVal);
    else login(emailVal, passVal);
  });
  if (state.loading) btn.disabled = true;

  return el("div", { className: "min-h-screen flex items-center justify-center px-4" },
    el("div", { className: "w-full max-w-md" },
      el("div", { className: "text-center mb-8" },
        el("div", { className: "inline-flex items-center gap-2 mb-2" },
          el("span", { className: "text-4xl" }, "🤖"),
          el("h1", { className: "text-3xl font-bold text-white" }, "AI Trading Bot"),
        ),
        el("p", { className: "text-slate-400" }, isRegister ? "Bring your own brokerage. Claude does the rest." : "Powered by Claude AI"),
      ),
      el("div", { className: "bg-slate-900 border border-slate-700 rounded-2xl p-8 fade-in" },
        el("h2", { className: "text-xl font-semibold text-white mb-6" }, isRegister ? "Create your account" : "Sign in"),
        err, form,
        el("p", { className: "text-center text-slate-400 text-sm mt-6" },
          isRegister ? "Already have an account? " : "Don't have an account? ",
          el("a", { href: "#", className: "text-teal-400 hover:underline",
            onClick: e => { e.preventDefault(); setState({ page: isRegister ? "login" : "register", error: "" }); }
          }, isRegister ? "Sign in" : "Create one")
        ),
      ),
    )
  );
}

function renderDashboard() {
  const p = state.portfolio;
  const bot = state.botStatus;
  const trades = state.trades;

  const dot = el("span", { className: "w-2 h-2 rounded-full " + (bot.running ? "bg-teal-400 pulse" : "bg-slate-500") });
  const statusText = el("span", { className: "text-sm " + (bot.running ? "text-teal-400 font-medium" : "text-slate-500") }, bot.status || "stopped");
  const lastRun = bot.last_run ? el("p", { className: "text-slate-500 text-xs mt-1" }, "Last cycle: " + bot.last_run) : null;

  const botBtn = el("button", {
    className: "px-8 py-3 rounded-lg font-bold transition " + (bot.running ? "bg-red-600 hover:bg-red-500 text-white" : "bg-teal-500 hover:bg-teal-400 text-black"),
    disabled: state.botLoading,
    onClick: toggleBot,
  }, state.botLoading ? "..." : (bot.running ? "Stop Bot" : "Start Bot"));

  function statCard(label, value, color, sub) {
    return el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-5" },
      el("p", { className: "text-slate-400 text-sm mb-1" }, label),
      el("p", { className: "text-2xl font-bold " + (color || "text-white") }, value),
      sub ? el("p", { className: "text-slate-500 text-xs mt-1" }, sub) : null,
    );
  }

  const fmt = n => "$" + parseFloat(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const holdings = p?.holdings || {};
  const today = new Date().toISOString().slice(0, 10);
  const todayTrades = trades.filter(t => t.timestamp?.startsWith(today));

  const holdingRows = Object.entries(holdings).map(([sym, h]) => {
    const pct = parseFloat(h.percent_change || 0) * 100;
    return el("div", { className: "flex items-center justify-between py-2.5 border-b border-slate-800 last:border-0" },
      el("div", null,
        el("span", { className: "text-white font-medium" }, sym),
        el("span", { className: "text-slate-500 text-xs ml-2" }, parseFloat(h.quantity || 0).toFixed(4) + " shares"),
      ),
      el("div", { className: "text-right" },
        el("p", { className: "text-white" }, fmt(h.equity)),
        el("p", { className: "text-xs " + (pct >= 0 ? "text-teal-400" : "text-red-400") }, (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%"),
      ),
    );
  });

  // Trades — click to expand full AI reasoning
  const tradeRows = trades.slice(0, 10).map(t => {
    const card = el("div", { className: "trade-card py-2.5 border-b border-slate-800 last:border-0" });
    const header = el("div", { className: "flex items-center justify-between gap-2" },
      el("div", { className: "flex items-center gap-2 min-w-0" },
        el("span", { className: "text-xs font-bold px-2 py-0.5 rounded shrink-0 " + (t.action === "buy" ? "bg-teal-900 text-teal-400" : "bg-red-900 text-red-400") }, t.action.toUpperCase()),
        el("span", { className: "text-white text-sm font-medium" }, t.symbol),
        t.dry_run ? el("span", { className: "text-xs text-slate-500" }, "(sim)") : null,
      ),
      el("div", { className: "flex items-center gap-3 shrink-0" },
        el("span", { className: "text-white text-sm" }, "$" + t.amount_usd.toFixed(2)),
        el("span", { className: "text-slate-500 text-xs" }, new Date(t.timestamp).toLocaleTimeString()),
        el("span", { className: "trade-chevron text-slate-500 text-xs" }, "▼"),
      ),
    );
    const reason = el("div", { className: "trade-reason mt-2 bg-slate-800 rounded-lg p-3 text-sm text-slate-300 leading-relaxed" }, t.reason || "No reasoning recorded.");
    card.append(header, reason);
    card.addEventListener("click", () => card.classList.toggle("expanded"));
    return card;
  });

  const errBanner = null; // errors now shown as toasts

  // AI Market Analysis card
  const commentary = bot.market_commentary;
  const analysisCard = commentary ? el("div", { className: "bg-slate-900 border border-teal-700/40 rounded-xl p-6" },
    el("div", { className: "flex items-center gap-2 mb-3" },
      el("span", { className: "text-lg" }, "🧠"),
      el("h3", { className: "text-white font-semibold" }, "AI Market Analysis"),
      el("span", { className: "text-xs text-teal-400 border border-teal-700 rounded-full px-2 py-0.5 ml-auto" }, "Latest from Claude"),
    ),
    el("p", { className: "text-slate-300 text-sm leading-relaxed" }, commentary),
  ) : null;

  const logLines = (bot.log || []).map(l => el("p", null, l));

  return el("div", { className: "min-h-screen fade-in" },
    el("nav", { className: "border-b border-slate-800 px-6 py-4 flex items-center justify-between" },
      el("div", { className: "flex items-center gap-2" },
        el("span", { className: "text-2xl" }, "🤖"),
        el("span", { className: "font-bold text-white text-lg" }, "AI Trading Bot"),
      ),
      el("div", { className: "flex items-center gap-4" },
        el("span", { className: "text-slate-400 text-sm hidden sm:block" }, state.email),
        state.subscription.active
          ? el("a", { href: "#", className: "text-xs text-teal-400 border border-teal-700 px-2 py-0.5 rounded-full hover:border-teal-400 transition", onClick: e => { e.preventDefault(); manageBilling(); } }, "Pro ✓")
          : el("a", { href: "#", className: "text-xs text-slate-400 border border-slate-600 px-2 py-0.5 rounded-full hover:border-teal-400 hover:text-teal-400 transition", onClick: e => { e.preventDefault(); setState({ page: "pricing" }); } }, "Upgrade"),
        el("a", { href: "#", className: "text-slate-400 hover:text-white text-sm transition", onClick: e => { e.preventDefault(); goSettings(); } }, "Settings"),
        el("a", { href: "#", className: "text-slate-400 hover:text-white text-sm transition", onClick: e => { e.preventDefault(); logout(); } }, "Logout"),
      ),
    ),
    el("div", { className: "max-w-6xl mx-auto px-4 py-8 space-y-6" },
      errBanner,
      // Bot control
      el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4" },
        el("div", null,
          el("h2", { className: "text-white font-semibold text-lg mb-1" }, "Trading Bot"),
          el("div", { className: "flex items-center gap-1.5" }, dot, statusText),
          lastRun,
        ),
        botBtn,
      ),
      // Stats
      el("div", { className: "grid grid-cols-2 lg:grid-cols-4 gap-4" },
        statCard("Portfolio Value", p ? fmt(p.portfolio_value) : "—", "text-white", p?.broker ? "via " + p.broker : ""),
        statCard("Buying Power", p ? fmt(p.buying_power) : "—", "text-teal-400"),
        statCard("Positions", Object.keys(holdings).length, "text-white", "active holdings"),
        statCard("Trades Today", todayTrades.length, "text-white", trades.some(t => t.dry_run) ? "includes simulations" : "live trades"),
      ),
      // AI Analysis
      analysisCard,
      el("div", { className: "grid lg:grid-cols-2 gap-6" },
        // Holdings
        el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6" },
          el("h3", { className: "text-white font-semibold mb-4" }, "Holdings"),
          holdingRows.length ? el("div", null, ...holdingRows)
            : el("p", { className: "text-slate-500 text-sm" }, "No positions yet. Start the bot to begin trading."),
        ),
        // Trades
        el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6" },
          el("h3", { className: "text-white font-semibold mb-1" }, "Recent Trades"),
          el("p", { className: "text-slate-500 text-xs mb-4" }, "Tap any trade to see why Claude made this decision"),
          tradeRows.length ? el("div", null, ...tradeRows)
            : el("p", { className: "text-slate-500 text-sm" }, "No trades yet."),
        ),
      ),
      // Bot log
      logLines.length ? el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6" },
        el("h3", { className: "text-white font-semibold mb-3" }, "Bot Log"),
        el("div", { className: "bg-black rounded-lg p-4 font-mono text-xs text-green-400 space-y-1 max-h-48 overflow-y-auto" }, ...logLines),
      ) : null,
    ),
  );
}

const BROKERS = [
  {
    id: "alpaca",
    name: "Alpaca",
    icon: "🦙",
    desc: "Free account, fractional shares, paper trading included.",
    link: "https://alpaca.markets",
    linkLabel: "Create free account →",
    fields: [
      { key: "alpaca_api_key", label: "API Key", type: "text", placeholder: "PKXXXXXXXXXXXXXXXX" },
      { key: "alpaca_secret_key", label: "Secret Key", type: "password", placeholder: "Leave blank to keep existing" },
    ],
    extra: "paperToggle",
  },
  {
    id: "robinhood",
    name: "Robinhood",
    icon: "🪶",
    desc: "Sign in with your existing Robinhood account.",
    fields: [
      { key: "rh_username", label: "Email", type: "email", placeholder: "you@example.com" },
      { key: "rh_password", label: "Password", type: "password", placeholder: "Leave blank to keep existing" },
    ],
  },
  { id: "webull",  name: "Webull",               icon: "📊", desc: "Coming soon", disabled: true, fields: [] },
  { id: "ibkr",   name: "Interactive Brokers",   icon: "🏦", desc: "Coming soon", disabled: true, fields: [] },
];

function renderSettings() {
  // Always initialize — don't leave settingsForm null even if loadSettings failed
  if (!state.settingsForm) {
    state.settingsForm = buildForm(state.settings || {});
  }
  const form = state.settingsForm;
  const broker = BROKERS.find(b => b.id === form.broker) || BROKERS[0];

  function field(label, hint, inputEl) {
    const children = [el("label", { className: "block text-sm font-medium text-slate-300 mb-1.5" }, label)];
    if (hint) children.push(el("p", { className: "text-xs text-slate-500 mb-2" }, hint));
    children.push(inputEl);
    return el("div", null, ...children);
  }

  const mkInput = (key, type, placeholder) =>
    inp({ type, placeholder, value: form[key] ?? "", onChange: e => updateForm(key, e.target.value) });

  const mkNumberInput = (key, placeholder) => {
    const e = inp({ type: "number", placeholder, value: form[key] ?? "", onChange: ev => updateForm(key, parseFloat(ev.target.value) || 0) });
    return e;
  };

  const brokerGrid = el("div", { className: "grid grid-cols-2 gap-3" },
    ...BROKERS.map(b =>
      el("button", {
        type: "button",
        disabled: b.disabled,
        className: "relative text-left p-4 rounded-xl border transition " +
          (b.disabled ? "opacity-40 cursor-not-allowed bg-slate-800 border-slate-700" :
            form.broker === b.id
              ? "bg-teal-900/30 border-teal-500 ring-1 ring-teal-500"
              : "bg-slate-800 border-slate-600 hover:border-slate-400"),
        onClick: () => { if (!b.disabled) updateForm("broker", b.id); },
      },
        el("div", { className: "flex items-center gap-2 mb-1" },
          el("span", { className: "text-xl" }, b.icon),
          el("span", { className: "text-white font-medium text-sm" }, b.name),
          form.broker === b.id && !b.disabled ? el("span", { className: "ml-auto text-teal-400 text-xs font-bold" }, "✓") : null,
        ),
        el("p", { className: "text-slate-400 text-xs leading-snug" }, b.desc),
      )
    )
  );

  const credFields = broker.fields.length > 0 ? el("div", { className: "mt-6 pt-5 border-t border-slate-700 space-y-4" },
    el("h3", { className: "text-white font-medium text-sm" }, broker.icon + " " + broker.name + " Login"),
    ...(broker.fields.map(f => field(f.label, null, mkInput(f.key, f.type, f.placeholder)))),
    broker.extra === "paperToggle" ? field("Trading Mode", null,
      toggleGroup([["Paper (Simulated — safe to start)", true], ["Live (Real Money)", false]], form.alpaca_paper, val => updateForm("alpaca_paper", val))
    ) : null,
    broker.link ? el("a", {
      href: broker.link, target: "_blank",
      className: "inline-flex items-center gap-1 text-teal-400 text-xs hover:underline",
    }, broker.linkLabel || "Learn more →") : null,
  ) : null;

  const errEl = state.error ? el("div", { className: "bg-red-900/30 border border-red-700 text-red-400 rounded-lg px-4 py-3 text-sm" }, state.error) : null;
  const saveBtn = el("button", {
    type: "button",
    className: "w-full bg-teal-500 hover:bg-teal-400 disabled:opacity-50 text-black font-bold py-3 rounded-lg transition",
    disabled: state.loading,
    onClick: saveSettings,
  }, state.loading ? "Saving..." : state.settingsSaved ? "Connected! ✓" : "Save & Connect");

  return el("div", { className: "min-h-screen fade-in" },
    el("nav", { className: "border-b border-slate-800 px-6 py-4 flex items-center gap-4" },
      el("a", { href: "#", className: "text-slate-400 hover:text-white transition text-sm", onClick: e => { e.preventDefault(); goDashboard(); } }, "← Dashboard"),
      el("span", { className: "text-white font-semibold" }, "Connect Your Brokerage"),
    ),
    el("div", { className: "max-w-xl mx-auto px-4 py-8 space-y-5" },
      el("div", { className: "text-center pb-2" },
        el("p", { className: "text-slate-400 text-sm" }, "Connect your broker and let Claude AI handle the rest. No API key required."),
      ),
      el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6" },
        el("h2", { className: "text-white font-semibold mb-4" }, "Select a Brokerage"),
        brokerGrid,
        credFields,
      ),
      el("details", { className: "bg-slate-900 border border-slate-700 rounded-xl overflow-hidden" },
        el("summary", { className: "p-5 cursor-pointer text-white font-medium flex items-center justify-between select-none hover:bg-slate-800/50 transition list-none" },
          el("span", null, "⚙️  Risk Controls"),
          el("span", { className: "text-slate-500 text-xs" }, "optional — click to expand"),
        ),
        el("div", { className: "px-6 pb-6 pt-4 space-y-5 border-t border-slate-700" },
          el("div", { className: "grid grid-cols-2 gap-4" },
            field("Max per trade ($)", null, mkNumberInput("max_position_usd", "100")),
            field("Daily loss limit ($)", null, mkNumberInput("max_daily_loss_usd", "50")),
          ),
          field("Check every (minutes)", null, mkNumberInput("run_interval_minutes", "60")),
          field("Mode", "Start in simulation to test before going live",
            toggleGroup([["Simulation (recommended)", true], ["Live trades", false]], form.dry_run, val => updateForm("dry_run", val))
          ),
        ),
      ),
      errEl,
      saveBtn,
      state.settingsSaved
        ? el("div", { className: "bg-teal-900/30 border border-teal-600 rounded-xl p-4 text-center" },
            el("p", { className: "text-teal-400 font-semibold mb-1" }, "✓ Brokerage connected!"),
            state.subscription?.active
              ? el("button", {
                  className: "mt-2 bg-teal-500 hover:bg-teal-400 text-black font-bold px-6 py-2 rounded-lg transition",
                  onClick: () => { setState({ page: "dashboard" }); loadDashboard(); },
                }, "Go to Dashboard & Start Bot →")
              : el("button", {
                  className: "mt-2 bg-teal-500 hover:bg-teal-400 text-black font-bold px-6 py-2 rounded-lg transition",
                  onClick: () => setState({ page: "pricing" }),
                }, "Subscribe to Start Trading →"),
          )
        : el("p", { className: "text-center text-slate-500 text-xs pb-4" }, "Credentials are encrypted. Claude AI is built in — no extra API key needed."),
    ),
  );
}

function renderPricing() {
  const features = [
    "Claude AI analyzes your portfolio every hour",
    "Supports Alpaca (any broker), Robinhood + more",
    "Full AI reasoning — see exactly why every trade was made",
    "Real-time market commentary from Claude",
    "Paper trading mode — test risk-free first",
    "Cancel anytime — no lock-in",
  ];
  return el("div", { className: "min-h-screen fade-in" },
    el("nav", { className: "border-b border-slate-800 px-6 py-4 flex items-center gap-4" },
      el("a", { href: "#", className: "text-slate-400 hover:text-white transition text-sm", onClick: e => { e.preventDefault(); goDashboard(); } }, "← Dashboard"),
      el("span", { className: "text-white font-semibold" }, "Upgrade to Pro"),
    ),
    el("div", { className: "max-w-lg mx-auto px-4 py-16 text-center" },
      el("div", { className: "text-5xl mb-4" }, "🚀"),
      el("h1", { className: "text-3xl font-bold text-white mb-3" }, "Start Trading with AI"),
      el("p", { className: "text-slate-400 mb-10" }, "One flat monthly fee. Connect your broker and go — Claude AI is included."),
      el("div", { className: "bg-slate-900 border border-teal-500/40 rounded-2xl p-8 mb-6 text-left" },
        el("div", { className: "flex items-end gap-2 mb-6" },
          el("span", { className: "text-5xl font-bold text-white" }, "$19"),
          el("span", { className: "text-slate-400 mb-2" }, "/ month"),
          el("span", { className: "text-xs text-teal-400 border border-teal-700 rounded-full px-2 py-1 mb-2 ml-2" }, "3-day free trial"),
        ),
        el("ul", { className: "space-y-3 mb-8" },
          ...features.map(f => el("li", { className: "flex items-center gap-3 text-slate-300 text-sm" },
            el("span", { className: "text-teal-400 font-bold" }, "✓"), f,
          ))
        ),
        el("button", {
          className: "w-full bg-teal-500 hover:bg-teal-400 disabled:opacity-50 text-black font-bold py-4 rounded-xl text-lg transition",
          disabled: state.loading,
          onClick: subscribe,
        }, state.loading ? "Redirecting..." : "Start Free Trial — $19/mo after"),
      ),
      el("p", { className: "text-slate-500 text-xs" }, "Payments secured by Stripe. Cancel anytime."),
    ),
  );
}

// ── Navigation ─────────────────────────────────────────────────────────────
function goDashboard() {
  setState({ page: "dashboard", error: "" });
  loadDashboard();
}

function goSettings() {
  setState({ page: "settings", error: "" });
  loadSettings();
}

// ── Modals ──────────────────────────────────────────────────────────────────
function renderModal() {
  const m = state.modal;
  if (!m) return null;

  const backdrop = el("div", { className: "modal-backdrop", onClick: e => { if (e.target === backdrop) closeModal(); } });

  let box;
  if (m.type === "confirm-start") {
    const s = state.settings || {};
    box = el("div", { className: "modal-box" },
      el("div", { className: "text-3xl mb-3 text-center" }, "🤖"),
      el("h2", { className: "text-white font-bold text-xl text-center mb-2" }, "Start AI Trading Bot?"),
      el("p", { className: "text-slate-400 text-sm text-center mb-5" }, "Claude will analyze your portfolio every " + (s.run_interval_minutes || 30) + " min and trade automatically."),
      el("div", { className: "bg-slate-800 rounded-xl p-4 mb-5 space-y-2 text-sm" },
        el("div", { className: "flex justify-between" }, el("span", { className: "text-slate-400" }, "Broker"), el("span", { className: "text-white capitalize" }, s.broker || "—")),
        el("div", { className: "flex justify-between" }, el("span", { className: "text-slate-400" }, "Max per trade"), el("span", { className: "text-white" }, "$" + (s.max_position_usd || 25))),
        el("div", { className: "flex justify-between" }, el("span", { className: "text-slate-400" }, "Daily loss limit"), el("span", { className: "text-white" }, "$" + (s.max_daily_loss_usd || 50))),
        el("div", { className: "flex justify-between" }, el("span", { className: "text-slate-400" }, "Mode"), el("span", { className: s.dry_run !== false ? "text-yellow-400" : "text-red-400" }, s.dry_run !== false ? "Simulation (safe)" : "⚠️ LIVE — real money")),
      ),
      el("button", {
        className: "w-full bg-teal-500 hover:bg-teal-400 text-black font-bold py-3 rounded-xl transition mb-2",
        onClick: doStartBot,
      }, "Confirm — Start Bot"),
      el("button", {
        className: "w-full text-slate-400 hover:text-white py-2 text-sm transition",
        onClick: closeModal,
      }, "Cancel"),
    );
  } else if (m.type === "stop-confirm") {
    box = el("div", { className: "modal-box text-center" },
      el("div", { className: "text-3xl mb-3" }, "⏹️"),
      el("h2", { className: "text-white font-bold text-xl mb-2" }, "Stop the bot?"),
      el("p", { className: "text-slate-400 text-sm mb-6" }, "The bot will finish its current cycle and stop. Open positions stay open."),
      el("button", {
        className: "w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition mb-2",
        onClick: doStopBot,
      }, "Stop Bot"),
      el("button", {
        className: "w-full text-slate-400 hover:text-white py-2 text-sm transition",
        onClick: closeModal,
      }, "Keep Running"),
    );
  } else if (m.type === "subscribe") {
    const features = ["Claude AI trades your portfolio automatically", "Full reasoning on every trade", "Paper trading to test risk-free", "Cancel anytime"];
    box = el("div", { className: "modal-box" },
      el("div", { className: "text-center mb-5" },
        el("div", { className: "text-4xl mb-2" }, "🚀"),
        el("h2", { className: "text-white font-bold text-xl mb-1" }, "Subscribe to Start Trading"),
        el("p", { className: "text-slate-400 text-sm" }, "3-day free trial, then $19/month"),
      ),
      el("ul", { className: "space-y-2 mb-5" },
        ...features.map(f => el("li", { className: "flex items-center gap-2 text-slate-300 text-sm" },
          el("span", { className: "text-teal-400" }, "✓"), f
        ))
      ),
      el("button", {
        className: "w-full bg-teal-500 hover:bg-teal-400 disabled:opacity-60 text-black font-bold py-3 rounded-xl transition mb-2",
        disabled: state.loading,
        onClick: () => { closeModal(); subscribe(); },
      }, state.loading ? "Loading..." : "Start Free Trial →"),
      el("button", {
        className: "w-full text-slate-400 hover:text-white py-2 text-sm transition",
        onClick: closeModal,
      }, "Not now"),
    );
  }

  backdrop.appendChild(box);
  return backdrop;
}

function renderToasts() {
  if (!state.toasts.length) return null;
  const container = el("div", { className: "toast-container" });
  state.toasts.forEach(t => container.appendChild(el("div", { className: "toast " + t.type }, t.msg)));
  return container;
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  let view;
  switch (state.page) {
    case "login":    view = renderLogin(false); break;
    case "register": view = renderLogin(true);  break;
    case "dashboard": view = renderDashboard(); break;
    case "settings": view = renderSettings();  break;
    case "pricing":  view = renderPricing();   break;
    default: view = renderLogin(false);
  }
  app.appendChild(view);
  const modal = renderModal();
  if (modal) app.appendChild(modal);
  const toasts = renderToasts();
  if (toasts) app.appendChild(toasts);
}

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("subscribed") === "true" && state.token) {
  window.history.replaceState({}, "", "/");
  setState({ page: "dashboard" });
  loadDashboard();
}

setInterval(() => {
  if (state.page === "dashboard") loadDashboard();
}, 30000);

render();
if (state.page === "dashboard") loadDashboard();
if (state.page === "settings") loadSettings();
</script>
</body>
</html>
