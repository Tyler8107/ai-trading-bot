<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Trading Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: "#00d4aa" } } }
    };
  </script>
  <style>
    body { background: #0a0f1e; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .fade-in { animation: fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    ::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-track{background:#0f172a} ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let state = {
  page: localStorage.getItem("token") ? "dashboard" : "login",
  token: localStorage.getItem("token") || "",
  email: localStorage.getItem("email") || "",
  portfolio: null,
  trades: [],
  botStatus: { running: false, status: "stopped", log: [], last_run: null },
  settings: null,
  error: "",
  loading: false,
  botLoading: false,
  settingsSaved: false,
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ── API ────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const res = await fetch("/api" + path, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(state.token ? { Authorization: "Bearer " + state.token } : {})
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ── Actions ────────────────────────────────────────────────────────────────
async function login(email, password) {
  setState({ loading: true, error: "" });
  try {
    const d = await api("POST", "/auth/login", { email, password });
    localStorage.setItem("token", d.token);
    localStorage.setItem("email", d.email);
    setState({ token: d.token, email: d.email, page: "dashboard", loading: false });
    loadDashboard();
  } catch(e) { setState({ error: e.message, loading: false }); }
}

async function register(email, password) {
  setState({ loading: true, error: "" });
  try {
    const d = await api("POST", "/auth/register", { email, password });
    localStorage.setItem("token", d.token);
    localStorage.setItem("email", d.email);
    setState({ token: d.token, email: d.email, page: "settings", loading: false });
    loadSettings();
  } catch(e) { setState({ error: e.message, loading: false }); }
}

function logout() {
  localStorage.clear();
  setState({ token: "", email: "", page: "login", portfolio: null, trades: [], error: "" });
}

async function loadDashboard() {
  try {
    const [p, t, s] = await Promise.all([
      api("GET", "/portfolio").catch(e => ({ error: e.message })),
      api("GET", "/trades").catch(() => []),
      api("GET", "/bot/status").catch(() => ({})),
    ]);
    setState({ portfolio: p.error ? null : p, trades: t, botStatus: s, error: p.error || "" });
  } catch(e) { setState({ error: e.message }); }
}

async function loadSettings() {
  try {
    const s = await api("GET", "/settings");
    setState({ settings: s });
  } catch(e) {}
}

async function saveSettings(form) {
  setState({ loading: true, error: "" });
  try {
    await api("PUT", "/settings", form);
    setState({ settings: form, loading: false, settingsSaved: true });
    setTimeout(() => setState({ settingsSaved: false }), 3000);
  } catch(e) { setState({ error: e.message, loading: false }); }
}

async function toggleBot() {
  setState({ botLoading: true });
  try {
    if (state.botStatus.running) await api("POST", "/bot/stop");
    else await api("POST", "/bot/start");
    await loadDashboard();
  } catch(e) { setState({ error: e.message }); }
  setState({ botLoading: false });
}

// ── Components ─────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "className") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "value" && (tag === "input" || tag === "select")) { e.value = v; }
      else if (k === "checked") e.checked = v;
      else if (k === "disabled") e.disabled = v;
      else if (k === "type" && tag === "input") e.type = v;
      else e.setAttribute(k, v);
    }
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined) continue;
    e.append(typeof c === "string" || typeof c === "number" ? c : c);
  }
  return e;
}

function input(attrs) {
  const e = document.createElement("input");
  const baseClass = "w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-teal-500 text-sm transition";
  e.className = (attrs.className || "") + " " + baseClass;
  e.type = attrs.type || "text";
  if (attrs.placeholder) e.placeholder = attrs.placeholder;
  if (attrs.value !== undefined) e.value = attrs.value;
  if (attrs.required) e.required = true;
  if (attrs.min) e.min = attrs.min;
  if (attrs.onChange) e.addEventListener("input", attrs.onChange);
  return e;
}

// ── Pages ──────────────────────────────────────────────────────────────────
function renderLogin(isRegister) {
  let emailVal = "", passVal = "";
  const err = el("div", { className: "bg-red-900/30 border border-red-700 text-red-400 rounded-lg px-4 py-3 mb-4 text-sm " + (state.error ? "" : "hidden") }, state.error);
  const emailInput = input({ placeholder: "you@example.com", type: "email", onChange: e => emailVal = e.target.value });
  const passInput = input({ placeholder: isRegister ? "min 8 characters" : "••••••••", type: "password", onChange: e => passVal = e.target.value });
  const btn = el("button", {
    type: "submit",
    className: "w-full bg-teal-500 hover:bg-teal-400 disabled:opacity-50 text-black font-bold py-3 rounded-lg transition",
  }, isRegister ? "Get Started" : "Sign In");

  const form = el("form", { className: "space-y-4" },
    el("div", null, el("label", { className: "block text-sm text-slate-400 mb-1" }, "Email"), emailInput),
    el("div", null, el("label", { className: "block text-sm text-slate-400 mb-1" }, "Password"), passInput),
    btn,
  );
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (isRegister) register(emailVal, passVal);
    else login(emailVal, passVal);
  });

  if (state.loading) btn.disabled = true;

  const switchLink = el("p", { className: "text-center text-slate-400 text-sm mt-6" },
    isRegister ? "Already have an account? " : "Don't have an account? ",
    el("a", {
      href: "#",
      className: "text-teal-400 hover:underline",
      onClick: e => { e.preventDefault(); setState({ page: isRegister ? "login" : "register", error: "" }); }
    }, isRegister ? "Sign in" : "Create one")
  );

  const card = el("div", { className: "bg-slate-900 border border-slate-700 rounded-2xl p-8 fade-in" },
    el("h2", { className: "text-xl font-semibold text-white mb-6" }, isRegister ? "Create your account" : "Sign in to your account"),
    err, form, switchLink
  );

  if (isRegister) {
    card.append(el("div", { className: "mt-6 bg-slate-800 rounded-lg p-4 text-xs text-slate-400 space-y-1" },
      el("p", { className: "font-medium text-slate-300 mb-1" }, "What you'll need:"),
      el("p", null, "• Alpaca API key (free at alpaca.markets) — connects any brokerage"),
      el("p", null, "• Anthropic API key (console.anthropic.com) — powers the AI"),
    ));
  }

  return el("div", { className: "min-h-screen flex items-center justify-center px-4" },
    el("div", { className: "w-full max-w-md" },
      el("div", { className: "text-center mb-8" },
        el("div", { className: "inline-flex items-center gap-2 mb-2" },
          el("span", { className: "text-4xl" }, "🤖"),
          el("h1", { className: "text-3xl font-bold text-white" }, "AI Trading Bot"),
        ),
        el("p", { className: "text-slate-400" }, isRegister ? "Bring your own brokerage. Claude does the rest." : "Powered by Claude AI"),
      ),
      card,
    )
  );
}

function renderDashboard() {
  const p = state.portfolio;
  const bot = state.botStatus;
  const trades = state.trades;

  // Bot status badge
  const dot = el("span", { className: "w-2 h-2 rounded-full " + (bot.running ? "bg-teal-400 pulse" : "bg-slate-500") });
  const statusText = el("span", { className: "text-sm " + (bot.running ? "text-teal-400 font-medium" : "text-slate-500") }, bot.status || "stopped");
  const lastRun = bot.last_run ? el("p", { className: "text-slate-500 text-xs mt-1" }, "Last cycle: " + bot.last_run) : null;

  const botBtn = el("button", {
    className: "px-8 py-3 rounded-lg font-bold transition " + (bot.running ? "bg-red-600 hover:bg-red-500 text-white" : "bg-teal-500 hover:bg-teal-400 text-black"),
    disabled: state.botLoading,
    onClick: toggleBot,
  }, state.botLoading ? "..." : (bot.running ? "Stop Bot" : "Start Bot"));

  function statCard(label, value, color, sub) {
    return el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-5" },
      el("p", { className: "text-slate-400 text-sm mb-1" }, label),
      el("p", { className: "text-2xl font-bold " + (color || "text-white") }, value),
      sub ? el("p", { className: "text-slate-500 text-xs mt-1" }, sub) : null,
    );
  }

  const fmt = n => "$" + parseFloat(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const holdings = p?.holdings || {};
  const today = new Date().toISOString().slice(0, 10);
  const todayTrades = trades.filter(t => t.timestamp?.startsWith(today));

  // Holdings list
  const holdingRows = Object.entries(holdings).map(([sym, h]) => {
    const pct = parseFloat(h.percent_change || 0) * 100;
    return el("div", { className: "flex items-center justify-between py-2 border-b border-slate-800 last:border-0" },
      el("div", null,
        el("span", { className: "text-white font-medium" }, sym),
        el("span", { className: "text-slate-500 text-xs ml-2" }, parseFloat(h.quantity || 0).toFixed(4) + " shares"),
      ),
      el("div", { className: "text-right" },
        el("p", { className: "text-white" }, fmt(h.equity)),
        el("p", { className: "text-xs " + (pct >= 0 ? "text-teal-400" : "text-red-400") }, (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%"),
      ),
    );
  });

  // Trades list
  const tradeRows = trades.slice(0, 8).map(t =>
    el("div", { className: "flex items-start justify-between py-2 border-b border-slate-800 last:border-0" },
      el("div", { className: "flex items-center gap-2" },
        el("span", { className: "text-xs font-bold px-2 py-0.5 rounded " + (t.action === "buy" ? "bg-teal-900 text-teal-400" : "bg-red-900 text-red-400") }, t.action.toUpperCase()),
        el("div", null,
          el("span", { className: "text-white text-sm font-medium" }, t.symbol),
          t.dry_run ? el("span", { className: "text-xs text-slate-500 ml-1" }, "(sim)") : null,
          el("p", { className: "text-slate-500 text-xs" }, (t.reason || "").slice(0, 50) + (t.reason?.length > 50 ? "…" : "")),
        ),
      ),
      el("div", { className: "text-right shrink-0" },
        el("p", { className: "text-white text-sm" }, "$" + t.amount_usd.toFixed(2)),
        el("p", { className: "text-slate-500 text-xs" }, new Date(t.timestamp).toLocaleTimeString()),
      ),
    )
  );

  // Log
  const logLines = (bot.log || []).map(l => el("p", null, l));

  const errBanner = state.error ? el("div", {
    className: "bg-red-900/30 border border-red-700 text-red-400 rounded-lg px-4 py-3 text-sm"
  }, state.error + (state.error.includes("not configured") ? " — " : ""),
    state.error.includes("not configured") ? el("a", { href: "#", className: "underline", onClick: e => { e.preventDefault(); goSettings(); } }, "Go to Settings") : null,
  ) : null;

  return el("div", { className: "min-h-screen fade-in" },
    // Nav
    el("nav", { className: "border-b border-slate-800 px-6 py-4 flex items-center justify-between" },
      el("div", { className: "flex items-center gap-2" },
        el("span", { className: "text-2xl" }, "🤖"),
        el("span", { className: "font-bold text-white text-lg" }, "AI Trading Bot"),
      ),
      el("div", { className: "flex items-center gap-4" },
        el("span", { className: "text-slate-400 text-sm hidden sm:block" }, state.email),
        el("a", { href: "#", className: "text-slate-400 hover:text-white text-sm transition", onClick: e => { e.preventDefault(); goSettings(); } }, "Settings"),
        el("a", { href: "#", className: "text-slate-400 hover:text-white text-sm transition", onClick: e => { e.preventDefault(); logout(); } }, "Logout"),
      ),
    ),
    el("div", { className: "max-w-6xl mx-auto px-4 py-8 space-y-6" },
      errBanner,
      // Bot control
      el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4" },
        el("div", null,
          el("h2", { className: "text-white font-semibold text-lg mb-1" }, "Trading Bot"),
          el("div", { className: "flex items-center gap-1.5" }, dot, statusText),
          lastRun,
        ),
        botBtn,
      ),
      // Stats
      el("div", { className: "grid grid-cols-2 lg:grid-cols-4 gap-4" },
        statCard("Portfolio Value", p ? fmt(p.portfolio_value) : "—", "text-white", p?.broker ? "via " + p.broker : ""),
        statCard("Buying Power", p ? fmt(p.buying_power) : "—", "text-teal-400"),
        statCard("Positions", Object.keys(holdings).length, "text-white", "active holdings"),
        statCard("Trades Today", todayTrades.length, "text-white", trades.some(t => t.dry_run) ? "includes simulations" : "live trades"),
      ),
      el("div", { className: "grid lg:grid-cols-2 gap-6" },
        // Holdings
        el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6" },
          el("h3", { className: "text-white font-semibold mb-4" }, "Holdings"),
          holdingRows.length ? el("div", { className: "space-y-0" }, ...holdingRows)
            : el("p", { className: "text-slate-500 text-sm" }, "No positions yet. Start the bot to begin trading."),
        ),
        // Trades
        el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6" },
          el("h3", { className: "text-white font-semibold mb-4" }, "Recent Trades"),
          tradeRows.length ? el("div", { className: "space-y-0" }, ...tradeRows)
            : el("p", { className: "text-slate-500 text-sm" }, "No trades yet."),
        ),
      ),
      // Log
      logLines.length ? el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6" },
        el("h3", { className: "text-white font-semibold mb-3" }, "Bot Log"),
        el("div", { className: "bg-black rounded-lg p-4 font-mono text-xs text-green-400 space-y-1 max-h-48 overflow-y-auto" }, ...logLines),
      ) : null,
    ),
  );
}

function renderSettings() {
  const s = state.settings || {};
  let form = {
    broker: s.broker || "alpaca",
    alpaca_api_key: s.alpaca_api_key || "",
    alpaca_secret_key: s.alpaca_secret_key === "***" ? "" : (s.alpaca_secret_key || ""),
    alpaca_paper: s.alpaca_paper !== false,
    rh_username: s.rh_username || "",
    rh_password: "",
    anthropic_api_key: s.anthropic_api_key === "***" ? "" : (s.anthropic_api_key || ""),
    max_position_usd: s.max_position_usd || 100,
    max_daily_loss_usd: s.max_daily_loss_usd || 50,
    run_interval_minutes: s.run_interval_minutes || 60,
    dry_run: s.dry_run !== false,
  };

  function field(label, hint, inputEl) {
    const children = [el("label", { className: "block text-sm font-medium text-slate-300 mb-1" }, label)];
    if (hint) children.push(el("p", { className: "text-xs text-slate-500 mb-2" }, hint));
    children.push(inputEl);
    return el("div", null, ...children);
  }

  function toggleGroup(key, options) {
    return el("div", { className: "flex gap-3" }, ...options.map(([label, val]) => {
      const btn = el("button", {
        type: "button",
        className: "flex-1 py-2.5 rounded-lg text-sm font-medium border transition " +
          (form[key] === val ? "bg-teal-500 border-teal-500 text-black" : "bg-slate-800 border-slate-600 text-slate-300 hover:border-slate-400"),
        onClick: () => { form[key] = val; setState({}); }
      }, label);
      return btn;
    }));
  }

  const mkInput = (key, type, placeholder) => {
    const i = input({ type, placeholder, value: form[key], onChange: e => form[key] = e.target.value });
    return i;
  };

  const errEl = state.error ? el("div", { className: "bg-red-900/30 border border-red-700 text-red-400 rounded-lg px-4 py-3 text-sm" }, state.error) : null;
  const saveBtn = el("button", {
    type: "submit",
    className: "w-full bg-teal-500 hover:bg-teal-400 disabled:opacity-50 text-black font-bold py-3 rounded-lg transition",
    disabled: state.loading,
  }, state.loading ? "Saving..." : state.settingsSaved ? "Saved! ✓" : "Save Settings");

  const alpacaFields = el("div", { className: "space-y-5" },
    field("Alpaca API Key", "Free at alpaca.markets — paper + live trading, connects any brokerage", mkInput("alpaca_api_key", "text", "PKXXXXXXXX")),
    field("Alpaca Secret Key", null, mkInput("alpaca_secret_key", "password", "••••••••")),
    field("Trading Mode", null, toggleGroup("alpaca_paper", [["Paper (Simulated)", true], ["Live (Real Money)", false]])),
  );

  const rhFields = el("div", { className: "space-y-5" },
    field("Robinhood Email", null, mkInput("rh_username", "email", "you@example.com")),
    field("Robinhood Password", null, mkInput("rh_password", "password", "••••••••")),
  );

  const formEl = el("form", { className: "space-y-8" },
    // Broker section
    el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6 space-y-5" },
      el("h2", { className: "text-white font-semibold text-lg" }, "Brokerage Connection"),
      field("Broker", null, toggleGroup("broker", [["Alpaca (any broker)", "alpaca"], ["Robinhood", "robinhood"]])),
      form.broker === "alpaca" ? alpacaFields : rhFields,
    ),
    // AI section
    el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6 space-y-5" },
      el("h2", { className: "text-white font-semibold text-lg" }, "AI (Claude)"),
      field("Anthropic API Key", "Get at console.anthropic.com — Claude Opus makes all trading decisions", mkInput("anthropic_api_key", "password", "sk-ant-...")),
    ),
    // Risk section
    el("div", { className: "bg-slate-900 border border-slate-700 rounded-xl p-6 space-y-5" },
      el("h2", { className: "text-white font-semibold text-lg" }, "Risk Controls"),
      el("div", { className: "grid grid-cols-2 gap-4" },
        field("Max Position Size ($)", "Max $ per trade", mkInput("max_position_usd", "number", "100")),
        field("Max Daily Loss ($)", "Bot pauses if exceeded", mkInput("max_daily_loss_usd", "number", "50")),
      ),
      field("Check Interval (minutes)", "How often Claude analyzes your portfolio", mkInput("run_interval_minutes", "number", "60")),
      field("Mode", null, toggleGroup("dry_run", [["Simulation (safe)", true], ["Real trades", false]])),
    ),
    errEl,
    saveBtn,
  );

  formEl.addEventListener("submit", e => { e.preventDefault(); saveSettings(form); });

  return el("div", { className: "min-h-screen fade-in" },
    el("nav", { className: "border-b border-slate-800 px-6 py-4 flex items-center gap-4" },
      el("a", { href: "#", className: "text-slate-400 hover:text-white transition text-sm", onClick: e => { e.preventDefault(); goDashboard(); } }, "← Dashboard"),
      el("span", { className: "text-white font-semibold" }, "Settings"),
    ),
    el("div", { className: "max-w-2xl mx-auto px-4 py-8" }, formEl),
  );
}

// ── Navigation ─────────────────────────────────────────────────────────────
function goDashboard() {
  setState({ page: "dashboard", error: "" });
  loadDashboard();
}

function goSettings() {
  setState({ page: "settings", error: "" });
  loadSettings();
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  let view;
  switch (state.page) {
    case "login":    view = renderLogin(false); break;
    case "register": view = renderLogin(true);  break;
    case "dashboard": view = renderDashboard(); break;
    case "settings": view = renderSettings();  break;
    default: view = renderLogin(false);
  }
  app.appendChild(view);
}

// Auto-refresh dashboard
setInterval(() => {
  if (state.page === "dashboard") loadDashboard();
}, 30000);

render();
</script>
</body>
</html>
